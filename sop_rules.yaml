workflows:
  invoice_processing:
    steps:
      - name: classify
        tool: classify_document
        on_error: "abort"
      - name: extract
        tool: extract_document_data
        on_error: "flag_and_abort"
      - name: validate_po
        tool: validate_against_master_data
        on_error: "flag_and_route"
      - name: match
        tool: match_invoice_to_po
        on_error: "continue"
    exception_handlers:
      mismatch:
        action: "flag_exception"
        route_to: "finance_team"
      missing_po:
        action: "route_task"
        route_to: "procurement_team"
